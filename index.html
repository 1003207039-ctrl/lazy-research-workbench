<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="打败懒惰" />
<meta name="theme-color" content="#6c5ce7" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<title>打败懒惰科研工作台 · 个人创作者工作台</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<!-- 移动端遮罩层 -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app">
  <!-- 左侧菜单 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">K</div>
      <div class="brand-text">
        <div class="brand-title">打败懒惰<br/>科研工作台</div>
        <div class="brand-sub">个人学术空间 · 妇科·盆底</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <!-- 单元1：科研奋斗 -->
      <div class="nav-group" data-group="research">
        <div class="nav-group-title">
          <span class="dot dot-research"></span>科研奋斗单元
        </div>
        <ul>
          <li class="nav-item active" data-page="dashboard">
            <span class="ico">🏠</span>今日科研看板
          </li>
          <li class="nav-item" data-page="weekly-paper">
            <span class="ico">📅</span>每周文献
          </li>
          <li class="nav-item" data-page="daily-paper">
            <span class="ico">📰</span>每日文献推送
          </li>
          <li class="nav-item" data-page="research-projects">
            <span class="ico">🧪</span>科研项目管理
          </li>
          <li class="nav-item" data-page="paper-writing">
            <span class="ico">✍️</span>论文撰写
          </li>
          <li class="nav-item" data-page="paper-submit">
            <span class="ico">📮</span>论文投稿
          </li>
          <li class="nav-item" data-page="library">
            <span class="ico">📚</span>我的文献库
          </li>
        </ul>
      </div>

      <!-- 单元2：临床工作 -->
      <div class="nav-group" data-group="clinic">
        <div class="nav-group-title">
          <span class="dot dot-clinic"></span>临床工作单元
        </div>
        <ul>
          <li class="nav-item" data-page="clinic-guideline">
            <span class="ico">📋</span>临床指南每周学习
          </li>
          <li class="nav-item" data-page="clinic-skill">
            <span class="ico">🩺</span>临床操作积累
          </li>
          <li class="nav-item" data-page="clinic-case">
            <span class="ico">🧠</span>临床病例分析
          </li>
          <li class="nav-item" data-page="clinic-duty">
            <span class="ico">🌙</span>临床值班笔记
          </li>
          <li class="nav-item" data-page="clinic-words">
            <span class="ico">🔤</span>学术英语单词本
          </li>
          <li class="nav-item" data-page="clinic-round">
            <span class="ico">💬</span>英语查房情景
          </li>
          <li class="nav-item" data-page="clinic-quiz">
            <span class="ico">📝</span>规培考试题库
          </li>
        </ul>
      </div>

      <!-- 单元3：生活精致 -->
      <div class="nav-group" data-group="life">
        <div class="nav-group-title">
          <span class="dot dot-life"></span>生活精致
        </div>
        <ul>
          <li class="nav-item" data-page="fitness">
            <span class="ico">💪</span>每周健身打卡
          </li>
          <li class="nav-item" data-page="weight">
            <span class="ico">⚖️</span>体重管理计划
          </li>
        </ul>
      </div>
    </nav>

    <div class="sidebar-footer">
      <div id="auth-container" class="auth-container"></div>
      <button class="btn-darkmode" id="btn-darkmode">🌙 切换深色模式</button>
      <button class="btn-darkmode" id="btn-reset" style="color:var(--red);margin-top:4px">🔄 重置示例数据</button>
      <div class="version">v2.0 · 打败懒惰版 · 云端同步</div>
    </div>
  </aside>

  <!-- 右侧主内容区 -->
  <main class="main" id="main">
    <!-- 顶部条 -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger" id="btn-hamburger">☰</button>
        <h1 id="page-title">今日科研看板</h1>
        <p id="page-sub">看见懒惰,然后打败它 · <span id="today-date"></span></p>
      </div>
      <div class="topbar-right">
        <div class="quick-search" style="position:relative">
          <input type="text" id="quick-search" placeholder="搜索文献 / 项目 / 笔记 / DOI…" />
          <div id="search-results" class="search-dropdown" style="display:none"></div>
        </div>
        <div class="toolbar-btns">
          <button class="btn-icon" id="btn-calendar" title="统一日历">📅</button>
          <button class="btn-icon" id="btn-tasks" title="任务中心">✅</button>
          <button class="btn-icon" id="btn-inbox" title="收件箱">📥</button>
          <button class="btn-icon" id="btn-stats" title="统计中心">📊</button>
          <button class="btn-icon" id="btn-settings" title="设置">⚙️</button>
        </div>
        <button class="btn-primary" id="btn-add">+ 新建</button>
      </div>
    </header>

    <!-- 动态页面内容 -->
    <section class="page" id="page-root">
      <!-- JS 渲染 -->
    </section>
  </main>
</div>

<!-- 移动端底部导航 -->
<nav class="bottom-nav" id="bottom-nav">
  <button class="bn-item" data-page="dashboard">
    <span class="bn-icon">🏠</span>
    <span class="bn-label">首页</span>
  </button>
  <button class="bn-item" data-page="calendar">
    <span class="bn-icon">📅</span>
    <span class="bn-label">日历</span>
  </button>
  <button class="bn-item" id="bn-add">
    <span class="bn-icon bn-add-circle">＋</span>
    <span class="bn-label">新增</span>
  </button>
  <button class="bn-item" data-page="tasks">
    <span class="bn-icon">✅</span>
    <span class="bn-label">任务</span>
  </button>
  <button class="bn-item" data-page="settings">
    <span class="bn-icon">⚙️</span>
    <span class="bn-label">我的</span>
  </button>
</nav>

<!-- 模态框 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title">新建任务</h3>
      <button class="modal-close" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn-ghost" id="modal-cancel">取消</button>
      <button class="btn-primary" id="modal-ok">保存</button>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js')
    .then(() => console.log('[PWA] Service Worker 已注册'))
    .catch(e => console.warn('[PWA] SW 注册失败', e));
}
// 检测是否可安装
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  window._pwaEvent = e;
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./cloud-config.js"></script>
<script src="./cloud.js"></script>
<script src="./app.js"></script>
<script src="./pages1.js"></script>
<script src="./pages2.js"></script>
<script src="./pages3.js"></script>
</body>
</html>
